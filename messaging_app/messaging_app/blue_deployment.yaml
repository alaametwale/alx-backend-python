apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-messaging
  labels:
    app: django-messaging
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-messaging
      version: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: django-messaging
        version: blue
    spec:
      containers:
      - name: django
        image: alx/django-messaging:2.0
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
